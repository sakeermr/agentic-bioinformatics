# ============================================================
# Agentic Bioinformatics Research Assistant
# Docker Compose
# ============================================================

version: "3.9"

services:
  # ── FastAPI Backend ────────────────────────────────────────
  api:
    build: .
    container_name: bioinformatics-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./reports:/app/reports
      - ./chroma_db:/app/chroma_db
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Streamlit UI ──────────────────────────────────────────
  ui:
    build: .
    container_name: bioinformatics-ui
    command: streamlit run app/ui/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - API_BASE_URL=http://api:8000/api/v1
    depends_on:
      - api
    restart: unless-stopped

volumes:
  reports:
  chroma_db:
  data:
